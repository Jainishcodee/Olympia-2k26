<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/olympia.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OLYMPIA 2K26 - The Digital Arena. Live sports scoring, interactive experiences, and real-time match tracking." />
    <meta property="og:title" content="OLYMPIA 2K26 - The Digital Arena" />
    <meta property="og:description" content="Enter the arena. Live sports scoring, interactive experiences, and real-time match tracking." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#071426" />
    <title>OLYMPIA 2K26 | The Digital Arena</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem('olympia-theme');
          t = (t === 'day' || t === 'night') ? t : 'night';
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t === 'day' ? 'light' : 'dark';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'day' ? '#FAF6EC' : '#071426');
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
